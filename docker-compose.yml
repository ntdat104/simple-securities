name: exchange

x-svc: &svc
  restart: unless-stopped
  depends_on:
    postgres: {condition: service_healthy}
    kafka: {condition: service_healthy}
  environment: &env
    APP_ENV: dev
    LOG_LEVEL: info
    KAFKA_BROKERS: kafka:9092
    JWT_SECRET: change-me-in-prod-please-32bytes!!
    DB_AUTO_CREATE: "true"            # dev: create missing databases (e.g. after adding a service)
  networks: [exchange]

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: exchange
      POSTGRES_PASSWORD: exchange
    command: ["postgres", "-c", "max_connections=300", "-c", "shared_buffers=256MB", "-c", "synchronous_commit=on"]
    ports: ["${PG_PORT:-5432}:5432"]
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exchange"]
      interval: 3s
      retries: 30
    networks: [exchange]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
    networks: [exchange]

  kafka:
    image: apache/kafka:3.9.0
    ports: ["9094:9094"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      retries: 30
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks: [exchange]

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    profiles: [tools]
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: exchange
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    networks: [exchange]

  identity:
    <<: *svc
    build: {context: ., args: {SERVICE: identity}}
    environment:
      <<: *env
      DATABASE_URL: postgres://exchange:exchange@postgres:5432/identity?sslmode=disable
      GRPC_ADDR: :9101
      HTTP_ADDR: :8101

  wallet:
    <<: *svc
    build: {context: ., args: {SERVICE: wallet}}
    environment:
      <<: *env
      DATABASE_URL: postgres://exchange:exchange@postgres:5432/wallet?sslmode=disable
      GRPC_ADDR: :9102
      HTTP_ADDR: :8102
      WALLET_FAUCET_ENABLED: "true"
      WALLET_MAX_DEPOSIT: "100000000"

  order:
    <<: *svc
    build: {context: ., args: {SERVICE: order}}
    environment:
      <<: *env
      DATABASE_URL: postgres://exchange:exchange@postgres:5432/orders?sslmode=disable
      GRPC_ADDR: :9103
      HTTP_ADDR: :8103
      WALLET_TRANSPORT: grpc            # grpc | http
      WALLET_GRPC_ADDR: wallet:9102
      WALLET_HTTP_URL: http://wallet:8102

  matching:
    <<: *svc
    build: {context: ., args: {SERVICE: matching}}
    environment:
      <<: *env
      DATABASE_URL: postgres://exchange:exchange@postgres:5432/matching?sslmode=disable
      HTTP_ADDR: :8104

  marketdata:
    <<: *svc
    build: {context: ., args: {SERVICE: marketdata}}
    environment:
      <<: *env
      DATABASE_URL: postgres://exchange:exchange@postgres:5432/marketdata?sslmode=disable
      GRPC_ADDR: :9105
      HTTP_ADDR: :8105

  futures:
    <<: *svc
    build: {context: ., args: {SERVICE: futures}}
    environment:
      <<: *env
      DATABASE_URL: postgres://exchange:exchange@postgres:5432/futures?sslmode=disable
      GRPC_ADDR: :9106
      HTTP_ADDR: :8106
      FUNDING_INTERVAL: 1h              # Binance uses 8h; shorter in dev to see funding settle

  matching-futures:
    <<: *svc
    build: {context: ., args: {SERVICE: matching}}
    environment:
      <<: *env
      MARKET: futures
      DATABASE_URL: postgres://exchange:exchange@postgres:5432/futures_matching?sslmode=disable
      HTTP_ADDR: :8107

  marketdata-futures:
    <<: *svc
    build: {context: ., args: {SERVICE: marketdata}}
    environment:
      <<: *env
      MARKET: futures
      DATABASE_URL: postgres://exchange:exchange@postgres:5432/futures_marketdata?sslmode=disable
      GRPC_ADDR: :9108
      HTTP_ADDR: :8108

  gateway:
    <<: *svc
    build: {context: ., args: {SERVICE: gateway}}
    depends_on:
      redis: {condition: service_healthy}
      kafka: {condition: service_healthy}
    ports: ["${GATEWAY_PORT:-8080}:8080"]
    environment:
      <<: *env
      HTTP_ADDR: :8080
      REDIS_ADDR: redis:6379
      RATE_LIMIT_ORDERS_PER_10S: "200"   # dev: leaves room for the market-maker bot
      RATE_LIMIT_IP_PER_MIN: "12000"     # dev: both bot users share one container IP (prod default 1200)
      UPSTREAM_TRANSPORT: grpc          # grpc | http  (service-to-service transport)
      IDENTITY_GRPC_ADDR: identity:9101
      IDENTITY_HTTP_URL: http://identity:8101
      WALLET_GRPC_ADDR: wallet:9102
      WALLET_HTTP_URL: http://wallet:8102
      ORDER_GRPC_ADDR: order:9103
      ORDER_HTTP_URL: http://order:8103
      MARKETDATA_GRPC_ADDR: marketdata:9105
      MARKETDATA_HTTP_URL: http://marketdata:8105
      FUTURES_GRPC_ADDR: futures:9106
      FUTURES_HTTP_URL: http://futures:8106
      FUTURES_MARKETDATA_GRPC_ADDR: marketdata-futures:9108
      FUTURES_MARKETDATA_HTTP_URL: http://marketdata-futures:8108

  mmbot:
    <<: *svc
    build: {context: ., args: {SERVICE: mmbot}}
    depends_on: [gateway]
    environment:
      <<: *env
      GATEWAY_URL: http://gateway:8080
      MMBOT_REFERENCE: binance          # binance | random (random walk if Binance is unreachable)
      MMBOT_ORDERS_PER_SEC: "15"        # per bot user, below the gateway limit (200 orders / 10s in dev)
      MMBOT_ORDER_TTL: 60s              # ladder orders live longer -> deeper books on 12 markets

volumes:
  pg_data:
  kafka_data:

networks:
  exchange:
