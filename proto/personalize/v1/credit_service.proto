syntax = "proto3";

package personalize.v1;

option go_package = "simple-securities/gen/personalize/v1";

import "google/api/annotations.proto";

// ---------------------------------------------------------------------------
// Enums
// ---------------------------------------------------------------------------

enum WalletType {
  WALLET_TYPE_UNSPECIFIED   = 0;
  WALLET_TYPE_MEMBERSHIP    = 1; // credit tặng từ membership — có expire
  WALLET_TYPE_COURSE        = 2; // credit tặng từ mua khoá học — có expire
  WALLET_TYPE_PURCHASED     = 3; // credit mua — KHÔNG có expire
  WALLET_TYPE_GIVEAWAY      = 4; // credit give away — có expire
}

enum ReservationStatus {
  RESERVATION_STATUS_UNSPECIFIED = 0;
  RESERVATION_STATUS_PENDING     = 1;
  RESERVATION_STATUS_COMMITTED   = 2;
  RESERVATION_STATUS_ROLLED_BACK = 3;
}

// ---------------------------------------------------------------------------
// Messages
// ---------------------------------------------------------------------------

message WalletBalance {
  string      wallet_id    = 1;
  WalletType  wallet_type  = 2;
  int64       balance      = 3; // unit: credits (integer, no float)
  int64       reserved     = 4; // soft-reserved, not yet committed
  int64       available    = 5; // balance - reserved
  optional int64 expire_at = 6; // unix ms; absent for PURCHASED
}

message TopUpRequest {
  string     user_id       = 1;
  WalletType wallet_type   = 2;
  int64      amount        = 3;
  optional int64 expire_at = 4; // unix ms; required for non-PURCHASED types
  string     idempotency_key = 5; // caller-generated UUID
  string     reference_id  = 6; // e.g. order_id, membership_id
}

message TopUpResponse {
  string wallet_id = 1;
  int64  new_balance = 2;
}

// ReserveCredits — soft reservation before deducting (called by personal service)
message ReserveCreditsRequest {
  string user_id         = 1;
  int64  amount          = 2;
  string idempotency_key = 3; // caller must generate a UUID per unlock attempt
  string stock_symbol    = 4; // for audit / event payload
  string request_id      = 5; // trace / correlation id
}

message ReserveCreditsResponse {
  string reservation_id = 1;
  int64  reserved_amount = 2;
  // breakdown per wallet so personal service can display it
  repeated WalletDeduction deductions = 3;
}

message WalletDeduction {
  string     wallet_id   = 1;
  WalletType wallet_type = 2;
  int64      amount      = 3;
}

// CommitReservation — finalize deduction after personal service confirms
message CommitReservationRequest {
  string reservation_id  = 1;
  string idempotency_key = 2;
}

message CommitReservationResponse {
  bool   success           = 1;
  int64  total_deducted    = 2;
}

// RollbackReservation — release soft reservation (e.g. personal service failed)
message RollbackReservationRequest {
  string reservation_id = 1;
  string reason         = 2;
}

message RollbackReservationResponse {
  bool success = 1;
}

// GetCreditBalance — summary across all wallets for a user
message GetCreditBalanceRequest {
  string user_id = 1;
}

message GetCreditBalanceResponse {
  string               user_id         = 1;
  int64                total_available = 2;
  repeated WalletBalance wallets       = 3;
}

// ---------------------------------------------------------------------------
// Service
// ---------------------------------------------------------------------------

service CreditService {
  // Internal — called by admin/membership/course service to top-up credits
  rpc TopUp(TopUpRequest) returns (TopUpResponse) {
    option (google.api.http) = {
      post: "/api/v1/credits/top-up"
      body: "*"
    };
  }

  // Called by personal service: soft-reserve credits atomically
  rpc ReserveCredits(ReserveCreditsRequest) returns (ReserveCreditsResponse) {
    option (google.api.http) = {
      post: "/api/v1/credits/reserve"
      body: "*"
    };
  }

  // Called by personal service after successful stock unlock insert
  rpc CommitReservation(CommitReservationRequest) returns (CommitReservationResponse) {
    option (google.api.http) = {
      post: "/api/v1/credits/commit"
      body: "*"
    };
  }

  // Called by personal service on failure to rollback reservation
  rpc RollbackReservation(RollbackReservationRequest) returns (RollbackReservationResponse) {
    option (google.api.http) = {
      post: "/api/v1/credits/rollback"
      body: "*"
    };
  }

  // Read balance — called by personal/frontend
  rpc GetCreditBalance(GetCreditBalanceRequest) returns (GetCreditBalanceResponse) {
    option (google.api.http) = {
      get: "/api/v1/credits/balance"
    };
  }
}
