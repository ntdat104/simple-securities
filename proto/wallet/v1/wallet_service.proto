syntax = "proto3";

package wallet.v1;

import "google/api/annotations.proto";
import "common/v1/types.proto"; // Import định nghĩa chung

option go_package = "/gen/wallet/v1";

service WalletService {
  // @grpc-gateway: GET /api/v1/wallet/balances
  rpc GetSpotBalances(GetSpotBalancesRequest) returns (GetSpotBalancesResponse) {
    option (google.api.http) = {
      get: "/api/v1/wallet/balances"
    };
  };

  // RPC nội bộ: Cập nhật số dư sau khi lệnh khớp (chỉ được gọi bởi Trading Service)
  rpc UpdateBalance(UpdateBalanceRequest) returns (UpdateBalanceResponse);
}

// MESSAGES CHO GETSPOTBALANCES
message GetSpotBalancesRequest {
  // user_id được trích xuất từ Auth Token
}
message GetSpotBalancesResponse {
  repeated common.v1.Balance balances = 1;
}

// MESSAGES CHO UPDATEBALANCE (Nội bộ)
message UpdateBalanceRequest {
  string user_id = 1;
  string asset = 2;
  string delta_available = 3; // + hoặc - số lượng
  string delta_locked = 4;    // + hoặc - số lượng
  string reference_id = 5;    // ID giao dịch/lệnh để ghi lịch sử
}
message UpdateBalanceResponse {
  bool success = 1;
  string new_available = 2;
  string new_locked = 3;
}